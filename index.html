<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Alice in Wonderland · Too Late to Save Wonderland</title>
  <meta name="description" content="An interactive cinematic story in English and Arabic. Alice arrives too late to save Wonderland." />
  <meta name="theme-color" content="#120305" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='10' y='6' width='44' height='52' rx='6' fill='%23f1e4c4' stroke='%23c9a25c' stroke-width='4'/%3E%3Cpath d='M32 26c-6-5-10-8-10-12 0-3 2.4-5 5-5 2 0 4 1.2 5 3 1-1.8 3-3 5-3 2.6 0 5 2 5 5 0 4-4 7-10 12z' fill='%238e0f1d'/%3E%3C/svg%3E" />
  <link rel="preload" href="assets/fonts/cinzel-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="is-loading">
     <header class="topbar">
    <button class="ctl ctl--sound" type="button" data-role="sound" aria-pressed="false" data-i18n-aria="soundAria">
      <svg class="ctl__icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" />
        <path class="wave wave--1" d="M16 9.5a4 4 0 0 1 0 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        <path class="wave wave--2" d="M18.5 7a7.5 7.5 0 0 1 0 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        <path class="slash" d="M4 4l16 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </svg>
      <span class="ctl__label" data-role="sound-label">Sound off</span>
    </button>

    <div class="ctl ctl--lang" role="group" data-i18n-aria="langAria" aria-label="Choose language">
      <button type="button" data-lang-option="en" aria-pressed="false">EN</button>
      <button type="button" data-lang-option="ar" aria-pressed="false" lang="ar">عربي</button>
    </div>
  </header>
    <main class="stage" id="stage">

  
    <div class="film" id="film" aria-hidden="true">
      <video id="video" muted playsinline preload="auto" disablepictureinpicture></video>
      <div class="film__tint"></div>
      <div class="film__darken" data-role="darken"></div>
      <div class="film__vignette"></div>
      <div class="film__grain"></div>
    </div>

     <section class="hero" id="hero">
      <div class="hero__back" aria-hidden="true"></div>
      <div class="hero__float" data-hero-float>
        <div class="hero__canvas" data-hero-canvas>
          <picture>
            <source media="(max-width: 900px)" srcset="assets/images/hero-poster-sm.jpg" />
            <img class="hero__poster" src="assets/images/hero-poster.jpg" alt="" fetchpriority="high" decoding="async" />
          </picture>
          <span class="hero__cup-anchor" aria-hidden="true"></span>
        </div>
      </div>
      <div class="hero__layers" data-hero-layers aria-hidden="true"></div>
      <div class="hero__shade" data-hero-shade aria-hidden="true"></div>
      <div class="hero__portal" data-hero-portal aria-hidden="true"></div>
      <canvas class="hero__dust" aria-hidden="true"></canvas>

      <p class="hero__caption" data-reveal="copy" data-i18n="caption">Too late to save Wonderland</p>

      <div class="hero__actions" data-reveal="actions">
        <button class="btn btn--gold" type="button" data-role="begin" data-i18n="begin" disabled>Begin with sound</button>
      </div>

      <p class="hero__cue" data-role="cue" hidden></p>
    </section>
  <div class="scrim" aria-hidden="true"></div>
    <article class="parchment" id="parchment" aria-live="polite" style="visibility:hidden">
      <div class="parchment__paper">
        <span class="parchment__corner parchment__corner--tl" aria-hidden="true"></span>
        <span class="parchment__corner parchment__corner--tr" aria-hidden="true"></span>
        <span class="parchment__corner parchment__corner--bl" aria-hidden="true"></span>
        <span class="parchment__corner parchment__corner--br" aria-hidden="true"></span>
        <header class="parchment__head">
          <p class="parchment__kicker" data-role="kicker"></p>
          <h2 class="parchment__title" data-role="title"></h2>
          <div class="parchment__rule" aria-hidden="true"></div>
        </header>
        <div class="parchment__body" data-role="body"></div>
      </div>
    </article>
     <div class="chapter-card" data-role="chapter-card" aria-hidden="true" style="visibility:hidden">
      <p class="chapter-card__kicker" data-role="kicker"></p>
      <h2 class="chapter-card__title" data-role="title"></h2>
    </div>
    <div class="ending" data-role="ending" style="visibility:hidden">
      <p class="ending__text" data-role="ending-text">To be continued…</p>
      <button class="btn btn--ghost" type="button" data-role="replay" data-i18n="replay">Return to the beginning</button>
    </div>
</body>
</html>
